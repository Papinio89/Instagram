name: Auto Update News

on:

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python update_news.py

      - name: Commit and push changes
        run: |
          git config user.name  'Bot Wiadomości'
          git config user.email 'bot@users.noreply.github.com'
          git add news.json raw_feed.json archive.json
          git diff --cached --quiet && echo "Brak zmian" && exit 0
          git commit -m "Automatyczna aktualizacja newsów [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
